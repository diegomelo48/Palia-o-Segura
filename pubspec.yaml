
name: paliacao_segura
description: Cuidados Paliativos Seguros - app de apoio clínico em cuidados paliativos.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.4

  # Seleção e exibição de imagens
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Visualização de PDF
  syncfusion_flutter_pdfviewer: ^35.1.37

  # Navegação
  go_router: ^14.3.0

  # Permissões
  permission_handler: ^11.3.1

  # Exibição de páginas web
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/pdfs/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icone.png"
